seed: 42
language: zho

data_root: data/dev_phase/subtask1
train_file: train/eng.csv
dev_file: dev/eng.csv

text_col: text
label_col: polarization
id_col: id

num_labels: 2
model_name: roberta-large
max_length: 256

test_size: 0.1
balance_test: false

use_class_weights: true

#learning_rate: 1e-5
learning_rate: 5e-6
lr_scheduler_type: cosine

optim: adamw_torch
max_grad_norm: 1

train_seeds: [13, 21, 42, 69, 1337]


weight_decay: 0.01
warmup_ratio: 0.10
label_smoothing_factor: 0.05


num_train_epochs: 5

per_device_train_batch_size: 4
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4

fp16: true

eval_strategy: steps
eval_steps: 100

save_strategy: steps
save_steps: 100
save_total_limit: 1

load_best_model_at_end: true

metric_for_best_model: eval_macro_f1
greater_is_better: true

logging_steps: 50
report_to: none

output_dir: outputs/checkpoints_xlm_roberta_large_khm
outputs_dir: outputs
predictions_file: outputs/eng_dev_predictions.csv
confusion_matrix_file: outputs/confusion_matrix_khm.png
