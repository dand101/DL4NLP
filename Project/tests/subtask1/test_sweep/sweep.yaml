command:
  - ${env}
  - .venv\Scripts\python.exe
  - main.py

method: bayes

metric:
  name: eval_macro_f1
  goal: maximize

parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 3.0e-5


  weight_decay:
    values: [0.0, 0.01, 0.05]

  label_smoothing_factor:
    values: [0.0, 0.05, 0.1]

  per_device_train_batch_size:
    values: [4, 8]

  gradient_accumulation_steps:
    values: [1, 2, 4]

  warmup_ratio:
    values: [0.05, 0.1]


  balance_test:
    values: ["true", "false"]

  use_class_weights:
    values: ["true", "false"]